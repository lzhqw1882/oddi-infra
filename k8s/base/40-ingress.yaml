apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oddi-ingress
  namespace: oddi
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: oddi.kr
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: front-api-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: front-web-service
            port:
              number: 80
