apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-web
  namespace: oddi
  labels:
    app: front-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-web
  template:
    metadata:
      labels:
        app: front-web
    spec:
      containers:
      - name: front-web
        image: oddi/front-web:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: oddi-config
        - secretRef:
            name: oddi-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: front-web-service
  namespace: oddi
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: front-web
