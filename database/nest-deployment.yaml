apiVersion: apps/v1
kind: Deployment

metadata:
  name: nest-deployment

# 배포 세부 정보
spec:
  replicas: 5
  selector:
    matchLabels:
      app: backend-app

  # 배포할 Pod 정의
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
        - name: nest-container
          image: nest-server:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          